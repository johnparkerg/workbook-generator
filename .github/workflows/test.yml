name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Plain apt (not a cache action): cached .debs skip the postinst that builds xelatex.fmt.
      - name: Install LaTeX
        run: sudo apt-get update -qq && sudo apt-get install -y -qq texlive-xetex texlive-latex-extra texlive-pictures texlive-lang-spanish poppler-utils > /dev/null
      - run: npm ci
      - run: npm test
